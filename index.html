<!doctype html>
<html lang="bn" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Groth Forge — Video Production &amp; Business Growth Agency | Pabna, Bangladesh</title>
    <meta
      name="description"
      content="Groth Forge is a Video Production &amp; Business Growth Agency based in Pabna Sadar, Bangladesh—building trust-first films, reels, and growth systems for businesses of every scale."
    />
    <meta
      property="og:title"
      content="Groth Forge — Video Production &amp; Business Growth Agency"
    />
    <meta
      property="og:description"
      content="Cinematic video production, brand documentaries, reels, and structured business growth packages in Pabna Sadar, Bangladesh."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('gf-theme');
          var root = document.documentElement;
          if (savedTheme === 'light') {
            root.classList.remove('dark');
          } else {
            root.classList.add('dark');
          }
          var savedLang = localStorage.getItem('gf-lang');
          if (savedLang === 'en' || savedLang === 'bn') {
            root.lang = savedLang;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8F7F4] text-[#111827] dark:bg-[#0B0E14] dark:text-[#F3F4F6] antialiased selection:bg-[#D4AF37]/25 selection:text-current">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
